<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/scr/assets/css/style.css">
    <title>프로필</title>
</head>

<body>
    <div id="wrap" class="container">
        <div class="profile_wrap">
            <div class="profile_header">
                <a href="../page/homepage.html" class="back_btn" ><img src="../scr/img/Vector.png" alt=""></a>
                <h2>Profile</h2>
            </div>

            <div class="profile_info">
                <img src="../scr/img/profile_img.png" alt="">
                <p class="profile_name">Jonas Macroni</p>
                <p class="profile_role">Expert</p>
            </div>

            <div class="profile_list">
                <a href="../page/contact_info_edit.html" class="info_item">
                    <img class="info_icons" src="../scr/img/contact.svg" alt="">
                    <span>Contact Icon</span>
                    <img class="info_next_icon" src="../scr/img/next_icon.svg" alt="">
                </a>
                <div class="info_item">
                    <img class="info_icons" src="../scr/img/funding.svg" alt="">

                    <img class="info_icons" src="../scr/img/bank.png" alt="">

                    <img class="info_next_icon" src="../scr/img/next_icon.svg" alt="">
                </div>
                <div class="info_item">
                    <img class="info_icons" src="../scr/img/doc.svg" alt="">
                    <span>Document Info</span>
                    <img class="info_next_icon" src="../scr/img/next_icon.svg" alt="">
                </div>
                <div class="info_item">
                    <img class="info_icons" src="../scr/img/setting.png" alt="">
                    <span>Settings</span>
                    <img class="info_next_icon" src="../scr/img/next_icon.svg" alt="">
                </div>
            </div>

            <footer class="bottom_nav">
                <div class="icon_wrap">
                    <a href="../page/homepage.html" class="footer_item">
                        <img src="../scr/img/home_icon.svg" alt="Home Icon" class="footer_icon" />

                    </a>
                    <a href="../page/product.html" class="footer_item">
                        <img src="../scr/img/product_icon.png" alt="Product Icon" class="footer_icon" />
                        <span class="footer_name">Product</span>
                    </a>
                    <a href="../page/transaction.html" class="footer_item">
                        <img src="../scr/img/transaction_icon.png" alt="Transaction Icon" class="footer_icon" />
                        <span class="footer_name">Transaction</span>
                    </a>
                    <a href="../page/account.html" class="footer_item">
                        <img src="../scr/img/account_icon.png" alt="Account Icon" class="footer_icon" />
                        <span class="footer_name">Account</span>
                    </a>
                </div>
            </footer>
        </div>
