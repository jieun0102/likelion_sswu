<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../scr/assets/css/style.css">
    <title>내 정보 수정</title>
</head>

<body>
    <div id="wrap" class="container">
        <div class="info_edit_wrap">
            <div class="edit_header">
                <a href="../page/account.html"><img src="../scr/img/Vector.png" alt=""></a>
                <p>Contact info</p>
            </div>

            <div class="edit_img_wrap">
                <img class="edit_img" src="../scr/img/profile_img.png" alt="">
                <div class="img_overlay"><button class="edit_img_icon"><img src="../scr/img/edit.svg" alt=""></button>
                </div>
            </div>

            <div class="edit_info_list_wrap">
                <div class="edit_info_list">
                    <p>Name</p>
                    <input type="text" class='edit_info_input' placeholder='Warren Buffet' />
                    <button>Change</button>
                </div>
                <div class="edit_info_list">
                    <p>Birthdate</p>
                    <input type="text" class='edit_info_input' placeholder='05 November 1993' />
                    <button>Change</button>
                </div>
                <div class="edit_info_list">
                    <p>Gender</p>
                    <input type="text" class='edit_info_input' placeholder='Male' />
                    <button>Change</button>
                </div>
                <div class="edit_info_list">
                    <p>Email</p>
                    <input type="text" class='edit_info_input' placeholder='warren.buff@invest.ai' />
                    <button>Change</button>
                </div>
                <div class="edit_info_list">
                    <p>Phone Number</p>
                    <input type="text" class='edit_info_input' placeholder='-' />
                    <button>Change</button>
                </div>
                <div class="edit_info_list">
                    <p>Address</p>
                    <input type="text" class='edit_info_input' placeholder='-' />
                    <button>Change</button>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
