<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../scr/assets/css/style.css">
    <title>회원가입</title>
</head>

<body>
    <div id="wrap" class="container">
        <div class="create_wrap">
            <a href="../page/start-signup.html">
                <img class="home_back_btn" src="../scr/img/Vector.png" alt="">
            </a>
            <div class="creat_title">
                <p>Create an account</p>
            </div>
            <div class="creat_subtitle">
                <p>Invest and double your income now</p>
            </div>
            <div class="creat_input">
                <input type="text" placeholder='Full name' class='name' />
                <input type="text" placeholder='Email address' class='email' />
                <input type="text" placeholder='Password' class='password' />
            </div>
            <div class="creat_btn">
                <a href="../page/homepage.html" class="creat_btn" type="button">Create account</a>
            </div>
            
        </div>
        <div class="bottom_text"><p>Already have an account?</p></div>
    </div>
</body>

</html>
