<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../scr/assets/css/style.css">
    <title>회원가입</title>
</head>

<body>
    <div id="wrap" class="container">
        <div class="create_wrap">
            <button class="up_btn"><img src="../scr/img/Vector.png" alt=""></button>
            <div class="creat_title">
                <p>Create an account</p>
            </div>
            <div class="creat_subtitle">
                <p>Invest and double your income now</p>
            </div>
            <div class="creat_input">
                <input value='Full name' name type="text" placeholder='Full name' className='name' />
                <input value='Email' type="text" placeholder='Email address' className='email' />
                <input value='Password' type="text" placeholder='Password' className='password' />
            </div>
            <button class="creat_btn" type="button">Create account</button>

        </div>
    </div>
</body>

</html>
